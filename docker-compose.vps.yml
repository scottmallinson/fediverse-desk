# Overlay for a VPS with a public address: Caddy terminates TLS in front of the
# bridge and gets a Let's Encrypt certificate on its own. See VPS.md.
#
#   docker compose -f docker-compose.yml -f docker-compose.vps.yml up -d
#
# The base file publishes the bridge on 127.0.0.1:4040 and that stays true here:
# it is how the host's own curl checks reach it. Caddy does not use that port,
# it reaches the container over the project network.
services:
  desk:
    # Named so the overlay is a complete description of the deployment even
    # though the base file already declares this.
    expose:
      - "4040"

  caddy:
    image: caddy:2-alpine
    container_name: fediverse-desk-caddy
    restart: unless-stopped

    # The only two ports open to the internet. 80 is not optional: Let's Encrypt
    # answers the HTTP-01 challenge there, and Caddy redirects it to 443.
    ports:
      - "80:80"
      - "443:443"

    # Deliberately not stack.env: that file holds a token with full admin on the
    # site, and the proxy has no business being able to read it.
    env_file:
      - caddy.env

    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

    # Certificates live in /data and the parsed config in /config; both are
    # volumes, so nothing else needs to be writable.
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Dropping every capability would otherwise cost it the one it needs to bind
    # 80 and 443.
    cap_add:
      - NET_BIND_SERVICE

    depends_on:
      - desk

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  caddy-data:
  caddy-config:
